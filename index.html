<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBA Portfolio Tracker</title>
    <!-- PDF.js library to parse PDFs strictly inside your browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #007bff;
            --text-main: #333;
            --text-muted: #6c757d;
            --profit: #28a745;
            --loss: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        h1 { text-align: center; margin-bottom: 25px; }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .dropzone {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background: #f8fbff;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .dropzone.dragover {
            background: #e1f0ff;
            border-color: #0056b3;
        }

        .dropzone p {
            margin: 8px 0;
            color: var(--text-muted);
        }

        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .clear-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .clear-btn:hover { background-color: #5a6268; }

        .portfolio-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .portfolio-item:last-child { border-bottom: none; }
        .item-header { font-weight: bold; font-size: 1.1em; grid-column: span 2; }
        .metric { font-size: 0.9em; }
        .profit { color: var(--profit); font-weight: bold; }
        .loss { color: var(--loss); font-weight: bold; }
        
        .delete-btn {
            background-color: var(--loss);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 14px;
            cursor: pointer;
            margin-top: 10px;
            grid-column: span 2;
        }

        input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        @media (min-width: 600px) {
            .portfolio-item {
                grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
                align-items: center;
            }
            .item-header, .delete-btn { grid-column: span 1; }
            .delete-btn { margin-top: 0; width: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FBA Portfolio Monitor</h1>

    <!-- Drop Zone -->
    <div class="card">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('pdfInput').click()">
            <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" onchange="handleFileSelect(this.files)">
            <h3 style="margin-top: 0; color: #007bff;">📄 Drop Freedom Broker PDF Report Here</h3>
            <p>or click to browse on your device</p>
            <p id="statusMsg" style="font-size: 0.9em; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Portfolio List -->
    <div class="card">
        <div class="portfolio-header">
            <h3 style="margin: 0;">Your Portfolio</h3>
            <button class="clear-btn" onclick="clearAllData()">Clear All Positions</button>
        </div>
        <div id="portfolioContainer">
            <!-- Positions rendered here -->
        </div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let portfolio = JSON.parse(localStorage.getItem('fba_portfolio')) || [];

    function saveAndRender() {
        localStorage.setItem('fba_portfolio', JSON.stringify(portfolio));
        renderPortfolio();
    }

    function clearAllData() {
        if (confirm("Are you sure you want to remove all saved positions?")) {
            portfolio = [];
            saveAndRender();
        }
    }

    // Drag and Drop
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) handleFileSelect(e.dataTransfer.files);
    });

    async function handleFileSelect(files) {
        const file = files[0];
        if (!file || file.type !== 'application/pdf') {
            alert('Please select a valid PDF file.');
            return;
        }

        const status = document.getElementById('statusMsg');
        status.textContent = 'Reading Freedom Broker report...';
        status.style.color = '#007bff';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                // Join tokens cleanly
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += ' ' + pageText;
            }

            parseReportText(fullText);
            status.textContent = 'Report imported successfully!';
            status.style.color = 'green';
        } catch (error) {
            console.error(error);
            status.textContent = 'Error reading the PDF. Please try again.';
            status.style.color = 'red';
        }
    }

    // --- Strict FBA Table Parser ---
    function parseReportText(text) {
        // Clear out previous junk entries before importing fresh
        portfolio = [];

        // STRICT PATTERN FOR FBA "Securities" TABLE:
        // 1. Ticker with exchange: ([A-Z0-9]{1,6}\.[A-Z]{2}) -> e.g. INTC.US, EUROB.GR
        // 2. ISIN code: ([A-Z]{2}[A-Z0-9]{9}\d) -> e.g. US4581401001
        // 3. Non-numeric description (Account + Asset type)
        // 4. Numbers: BegBal, EndingBal, Price, Currency, Valuation
        const strictFbaRegex = /([A-Z0-9]{1,6}\.[A-Z]{2})\s+([A-Z]{2}[A-Z0-9]{9}\d)[^\d]+?(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(USD|EUR|AMD)\s+(\d+(?:\.\d+)?)/g;

        let match;
        let importedCount = 0;

        while ((match = strictFbaRegex.exec(text)) !== null) {
            const ticker = match[1];
            const isin = match[2];
            const endingBalance = parseFloat(match[4]);
            const price = parseFloat(match[5]);
            const currency = match[6];
            const valuationUsd = parseFloat(match[7]);

            if (endingBalance > 0) {
                // Determine per-share price in USD
                const priceInUsd = currency === 'USD' ? price : (valuationUsd / endingBalance);

                portfolio.push({
                    id: Date.now() + Math.random(),
                    ticker: ticker,
                    shares: endingBalance,
                    buyPrice: priceInUsd, 
                    buyFee: 1.20,
                    sellFee: 1.20,
                    currentPrice: priceInUsd
                });
                importedCount++;
            }
        }

        if (importedCount > 0) {
            saveAndRender();
        } else {
            alert("Could not detect any valid stocks in the Securities section. Please ensure this is the official FBA brokerage PDF.");
        }
    }

    function updateBuyPrice(id, newBuyPrice) {
        const position = portfolio.find(p => p.id === id);
        if (position) {
            position.buyPrice = parseFloat(newBuyPrice) || 0;
            saveAndRender();
        }
    }

    function updateCurrentPrice(id, newPrice) {
        const position = portfolio.find(p => p.id === id);
        if (position) {
            position.currentPrice = parseFloat(newPrice) || 0;
            saveAndRender();
        }
    }

    function deletePosition(id) {
        portfolio = portfolio.filter(p => p.id !== id);
        saveAndRender();
    }

    function renderPortfolio() {
        const container = document.getElementById('portfolioContainer');
        container.innerHTML = '';

        if (portfolio.length === 0) {
            container.innerHTML = '<p style="color: gray; text-align: center; padding: 20px;">No positions added yet. Drop your FBA PDF report above to load your holdings.</p>';
            return;
        }

        portfolio.forEach(pos => {
            const totalInvested = (pos.shares * pos.buyPrice) + pos.buyFee;
            const breakEvenPrice = (totalInvested + pos.sellFee) / pos.shares;
            
            const grossValue = pos.shares * pos.currentPrice;
            const netProfit = grossValue - totalInvested - pos.sellFee;
            
            const profitClass = netProfit >= 0 ? 'profit' : 'loss';
            const profitSign = netProfit >= 0 ? '+' : '';

            const div = document.createElement('div');
            div.className = 'portfolio-item';
            div.innerHTML = `
                <div class="item-header">
                    ${pos.ticker}
                    <div style="font-size: 0.75em; color: var(--text-muted); font-weight: normal; margin-top: 4px;">
                        ${pos.shares} share(s) | Buy: 
                        <input type="number" step="any" value="${pos.buyPrice.toFixed(2)}" 
                               onchange="updateBuyPrice(${pos.id}, this.value)" 
                               style="width: 75px; padding: 2px 4px; display: inline-block;">
                    </div>
                </div>
                <div class="metric">
                    <label>Break-Even</label>
                    <strong>$${breakEvenPrice.toFixed(2)}</strong>
                </div>
                <div class="metric">
                    <label>Current Price</label>
                    <input type="number" step="any" value="${pos.currentPrice.toFixed(2)}" 
                           onchange="updateCurrentPrice(${pos.id}, this.value)" 
                           style="width: 85px;">
                </div>
                <div class="metric">
                    <label>Net P/L</label>
                    <span class="${profitClass}">${profitSign}$${netProfit.toFixed(2)}</span>
                </div>
                <button class="delete-btn" onclick="deletePosition(${pos.id})">Remove</button>
            `;
            container.appendChild(div);
        });
    }

    renderPortfolio();
</script>

</body>
</html>
