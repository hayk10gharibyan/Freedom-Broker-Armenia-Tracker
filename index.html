<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBA Portfolio Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #007bff;
            --success: #28a745;
            --text-main: #333;
            --text-muted: #6c757d;
            --profit: #28a745;
            --loss: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 850px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 25px; }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .api-settings {
            background: #eef5ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-settings input { flex-grow: 1; }

        .dropzone {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background: #f8fbff;
            cursor: pointer;
        }

        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        button {
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .btn-sync { background-color: var(--success); }
        .btn-clear { background-color: var(--text-muted); }
        .delete-btn { background-color: var(--loss); margin-top: 10px; grid-column: span 2; }

        .portfolio-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .portfolio-item:last-child { border-bottom: none; }
        .item-header { font-weight: bold; font-size: 1.1em; grid-column: span 2; }
        .profit { color: var(--profit); font-weight: bold; }
        .loss { color: var(--loss); font-weight: bold; }

        input {
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        @media (min-width: 600px) {
            .portfolio-item {
                grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
                align-items: center;
            }
            .item-header, .delete-btn { grid-column: span 1; }
            .delete-btn { margin-top: 0; width: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FBA Portfolio Monitor</h1>

    <!-- API Key Storage -->
    <div class="api-settings">
        <label><strong>Finnhub API Key:</strong></label>
        <input type="password" id="apiKeyInput" placeholder="Paste your free key here..." onchange="saveApiKey(this.value)">
    </div>

    <!-- Drop Zone -->
    <div class="card">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('pdfInput').click()">
            <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" onchange="handleFileSelect(this.files)">
            <h3 style="margin-top: 0; color: #007bff;">📄 Drop Freedom Broker PDF Here</h3>
            <p id="statusMsg" style="font-size: 0.9em; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Portfolio List -->
    <div class="card">
        <div class="portfolio-header">
            <button class="btn-sync" id="refreshBtn" onclick="fetchLivePrices()">🔄 Sync Live Prices</button>
            <button class="btn-clear" onclick="clearAllData()">Clear All Positions</button>
        </div>
        <div id="portfolioContainer"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let portfolio = JSON.parse(localStorage.getItem('fba_portfolio')) || [];
    
    // Load API Key from device storage
    document.getElementById('apiKeyInput').value = localStorage.getItem('finnhub_api_key') || '';

    function saveApiKey(key) {
        localStorage.setItem('finnhub_api_key', key.trim());
    }

    function saveAndRender() {
        localStorage.setItem('fba_portfolio', JSON.stringify(portfolio));
        renderPortfolio();
    }

    function clearAllData() {
        if (confirm("Are you sure you want to remove all saved positions?")) {
            portfolio = [];
            saveAndRender();
        }
    }

    // --- Live Price Fetching Engine ---
    async function fetchLivePrices() {
        const apiKey = localStorage.getItem('finnhub_api_key');
        if (!apiKey) {
            alert("Please paste your free Finnhub API key in the top box first.");
            return;
        }

        const btn = document.getElementById('refreshBtn');
        btn.textContent = 'Syncing...';
        btn.disabled = true;

        for (let i = 0; i < portfolio.length; i++) {
            let pos = portfolio[i];
            
            // Translate Freedom Broker tickers into global API formats
            let fetchSymbol = pos.ticker;
            if (fetchSymbol.endsWith('.EU')) fetchSymbol = fetchSymbol.replace('.EU', '.DE'); // XETRA
            if (fetchSymbol.endsWith('.GR')) fetchSymbol = fetchSymbol.replace('.GR', '.AT'); // Athens Exchange
            if (fetchSymbol.endsWith('.US')) fetchSymbol = fetchSymbol.replace('.US', '');    // US standard
            
            try {
                const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${fetchSymbol}&token=${apiKey}`);
                const data = await response.json();
                
                // Update if the API returns a valid current price ('c')
                if (data && data.c && data.c > 0) {
                    pos.currentPrice = data.c;
                }
            } catch (error) {
                console.error("Failed to fetch: " + fetchSymbol, error);
            }
            
            // Brief pause between requests to respect the free 60/min API speed limit
            await new Promise(r => setTimeout(r, 250));
        }

        saveAndRender();
        btn.textContent = '🔄 Sync Live Prices';
        btn.disabled = false;
    }

    // --- PDF Parsing Engine ---
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) handleFileSelect(e.dataTransfer.files);
    });

    async function handleFileSelect(files) {
        const file = files[0];
        if (!file || file.type !== 'application/pdf') return;

        const status = document.getElementById('statusMsg');
        status.textContent = 'Reading Freedom Broker report...';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += ' ' + textContent.items.map(item => item.str).join(' ');
            }

            parseReportText(fullText);
            status.textContent = 'Imported successfully!';
        } catch (error) {
            status.textContent = 'Error reading the PDF.';
        }
    }

    function parseReportText(text) {
        portfolio = [];
        const strictFbaRegex = /([A-Z0-9]{1,6}\.[A-Z]{2})\s+([A-Z]{2}[A-Z0-9]{9}\d)[^\d]+?(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\s+(USD|EUR|AMD)\s+(\d+(?:\.\d+)?)/g;
        let match;
        
        while ((match = strictFbaRegex.exec(text)) !== null) {
            const ticker = match[1];
            const endingBalance = parseFloat(match[4]);
            const price = parseFloat(match[5]);
            const currency = match[6];
            const valuationUsd = parseFloat(match[7]);

            if (endingBalance > 0) {
                const priceInUsd = currency === 'USD' ? price : (valuationUsd / endingBalance);
                portfolio.push({
                    id: Date.now() + Math.random(),
                    ticker: ticker,
                    shares: endingBalance,
                    buyPrice: priceInUsd, 
                    buyFee: 1.20,
                    sellFee: 1.20,
                    currentPrice: priceInUsd
                });
            }
        }
        saveAndRender();
    }

    function updateBuyPrice(id, newPrice) {
        const position = portfolio.find(p => p.id === id);
        if (position) { position.buyPrice = parseFloat(newPrice) || 0; saveAndRender(); }
    }

    function updateCurrentPrice(id, newPrice) {
        const position = portfolio.find(p => p.id === id);
        if (position) { position.currentPrice = parseFloat(newPrice) || 0; saveAndRender(); }
    }

    function deletePosition(id) {
        portfolio = portfolio.filter(p => p.id !== id);
        saveAndRender();
    }

    function renderPortfolio() {
        const container = document.getElementById('portfolioContainer');
        container.innerHTML = '';

        if (portfolio.length === 0) {
            container.innerHTML = '<p style="color: gray; text-align: center;">No positions added. Drop PDF above.</p>';
            return;
        }

        portfolio.forEach(pos => {
            const totalInvested = (pos.shares * pos.buyPrice) + pos.buyFee;
            const breakEvenPrice = (totalInvested + pos.sellFee) / pos.shares;
            const grossValue = pos.shares * pos.currentPrice;
            const netProfit = grossValue - totalInvested - pos.sellFee;
            
            const profitClass = netProfit >= 0 ? 'profit' : 'loss';
            const profitSign = netProfit >= 0 ? '+' : '';

            const div = document.createElement('div');
            div.className = 'portfolio-item';
            div.innerHTML = `
                <div class="item-header">
                    ${pos.ticker}
                    <div style="font-size: 0.75em; color: var(--text-muted); font-weight: normal; margin-top: 4px;">
                        ${pos.shares} share(s) | Buy: 
                        <input type="number" step="any" value="${pos.buyPrice.toFixed(2)}" 
                               onchange="updateBuyPrice(${pos.id}, this.value)" 
                               style="width: 75px; padding: 2px; display: inline-block;">
                    </div>
                </div>
                <div class="metric">
                    <label>Break-Even</label>
                    <strong>$${breakEvenPrice.toFixed(2)}</strong>
                </div>
                <div class="metric">
                    <label>Current Price</label>
                    <input type="number" step="any" value="${pos.currentPrice.toFixed(2)}" 
                           onchange="updateCurrentPrice(${pos.id}, this.value)" 
                           style="width: 85px;">
                </div>
                <div class="metric">
                    <label>Net P/L</label>
                    <span class="${profitClass}">${profitSign}$${netProfit.toFixed(2)}</span>
                </div>
                <button class="delete-btn" onclick="deletePosition(${pos.id})">Remove</button>
            `;
            container.appendChild(div);
        });
    }
    renderPortfolio();


// Automatically sync prices every 2 minutes (120,000 milliseconds)
    setInterval(() => {
        const apiKey = localStorage.getItem('finnhub_api_key');
        if (apiKey && portfolio.length > 0) {
            fetchLivePrices();
        }
    }, 120000);
    
</script>

</body>
</html>
