<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBA Portfolio Tracker</title>
    <!-- PDF.js library to read PDFs entirely inside the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #007bff;
            --text-main: #333;
            --text-muted: #6c757d;
            --profit: #28a745;
            --loss: #dc3545;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        h1 { text-align: center; margin-bottom: 25px; }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        /* Drag & Drop Upload Zone */
        .dropzone {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background: #f8fbff;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .dropzone.dragover {
            background: #e1f0ff;
            border-color: #0056b3;
        }

        .dropzone p {
            margin: 8px 0;
            color: var(--text-muted);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85em;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #0056b3; }

        .portfolio-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .portfolio-item:last-child { border-bottom: none; }
        .item-header { font-weight: bold; font-size: 1.1em; grid-column: span 2; }
        .metric { font-size: 0.9em; }
        .profit { color: var(--profit); font-weight: bold; }
        .loss { color: var(--loss); font-weight: bold; }
        
        .delete-btn {
            background-color: var(--loss);
            margin-top: 10px;
            grid-column: span 2;
        }

        @media (min-width: 600px) {
            .portfolio-item {
                grid-template-columns: repeat(4, 1fr) auto;
                align-items: center;
            }
            .item-header, .delete-btn { grid-column: span 1; }
            .delete-btn { margin-top: 0; width: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FBA Portfolio Monitor</h1>

    <!-- Drop Zone for PDF Report -->
    <div class="card">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('pdfInput').click()">
            <input type="file" id="pdfInput" accept="application/pdf" style="display: none;" onchange="handleFileSelect(this.files)">
            <h3 style="margin-top: 0; color: #007bff;">📄 Drop Freedom Broker PDF Report Here</h3>
            <p>or tap to browse on your device</p>
            <p id="statusMsg" style="font-size: 0.85em; font-weight: bold;"></p>
        </div>
    </div>

    <!-- Manual Entry (as fallback) -->
    <div class="card">
        <details>
            <summary style="cursor: pointer; font-weight: bold; color: #555;">Or Add Position Manually</summary>
            <div class="form-grid" style="margin-top: 15px;">
                <div>
                    <label>Ticker</label>
                    <input type="text" id="ticker" placeholder="e.g. AAPL">
                </div>
                <div>
                    <label>Shares</label>
                    <input type="number" id="shares" step="any" placeholder="10">
                </div>
                <div>
                    <label>Buy Price ($)</label>
                    <input type="number" id="buyPrice" step="any" placeholder="150.00">
                </div>
                <div>
                    <label>Buy Fee ($)</label>
                    <input type="number" id="buyFee" step="any" placeholder="1.20">
                </div>
                <div>
                    <label>Est. Sell Fee ($)</label>
                    <input type="number" id="sellFee" step="any" placeholder="1.20">
                </div>
            </div>
            <button onclick="addManualPosition()">Add Manually</button>
        </details>
    </div>

    <!-- Active Portfolio -->
    <div class="card" id="portfolioContainer">
        <h3>Your Portfolio</h3>
    </div>
</div>

<script>
    // Configure PDF.js Worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let portfolio = JSON.parse(localStorage.getItem('fba_portfolio')) || [];

    function saveAndRender() {
        localStorage.setItem('fba_portfolio', JSON.stringify(portfolio));
        renderPortfolio();
    }

    // --- Drag and Drop Listeners ---
    const dropzone = document.getElementById('dropzone');

    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            handleFileSelect(e.dataTransfer.files);
        }
    });

    // --- PDF Processing Engine ---
    async function handleFileSelect(files) {
        const file = files[0];
        if (!file || file.type !== 'application/pdf') {
            alert('Please select a valid PDF file.');
            return;
        }

        const status = document.getElementById('statusMsg');
        status.textContent = 'Reading PDF...';
        status.style.color = '#007bff';

        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n';
            }

            parseReportText(fullText);
            status.textContent = 'Report imported successfully!';
            status.style.color = 'green';
        } catch (error) {
            console.error(error);
            status.textContent = 'Failed to parse PDF. Format might be customized.';
            status.style.color = 'red';
        }
    }

    // --- Parser tailored to FBA table structures ---
  // --- Parser tailored to FBA report_1794313.pdf structure ---
    function parseReportText(text) {
        let importedCount = 0;

        // This regex specifically targets the FBA "Securities" table format:
        // Ticker | ISIN | Account | Asset type | Beg Bal | End Bal | Price
        const fbaPattern = /([A-Z0-9]+\.[A-Z]{2})\s*(?:\|\s*)?([A-Z0-9]{12})\s*(?:\|\s*)?(?:Trading|Non trading account.*?)\s*(?:\|\s*)?(?:Stocks|Depositary receipts|.*?)\s*(?:\|\s*)?(\d+(?:\.\d+)?)\s*(?:\|\s*)?(\d+(?:\.\d+)?)\s*(?:\|\s*)?(\d+(?:\.\d+)?)/gi;

        let match;
        // Reset regex index
        fbaPattern.lastIndex = 0;

        while ((match = fbaPattern.exec(text)) !== null) {
            const rawTicker = match[1]; // e.g., BYDDY.US or EUROB.GR
            const shares = parseFloat(match[4]); // Column: Ending balance
            const reportPrice = parseFloat(match[5]); // Column: Price

            if (shares > 0 && reportPrice > 0) {
                portfolio.push({
                    id: Date.now() + Math.random(),
                    ticker: rawTicker.replace('.US', ''), // Clean up US tickers
                    shares: shares,
                    // The report only shows current valuation, not actual purchase price
                    buyPrice: reportPrice, 
                    // Placeholders based on standard minimums; adjust as needed
                    buyFee: 1.20, 
                    sellFee: 1.20,
                    currentPrice: reportPrice
                });
                importedCount++;
            }
        }

        if (importedCount > 0) {
            saveAndRender();
            // Alert the user about the missing buy prices
            alert(`Successfully imported ${importedCount} positions from the FBA report!\n\nIMPORTANT: Because this report is a balance statement, it does not contain your original purchase prices. Please update the "Buy Price" manually to see accurate Profit/Loss calculations.`);
        } else {
            alert("No trade lines could be automatically matched. Please ensure you are dropping the 'Securities' page of the report.");
        }
    }
    function addManualPosition() {
        const ticker = document.getElementById('ticker').value.toUpperCase();
        const shares = parseFloat(document.getElementById('shares').value);
        const buyPrice = parseFloat(document.getElementById('buyPrice').value);
        const buyFee = parseFloat(document.getElementById('buyFee').value) || 0;
        const sellFee = parseFloat(document.getElementById('sellFee').value) || buyFee;

        if (!ticker || !shares || !buyPrice) {
            alert('Please fill in Ticker, Shares, and Buy Price.');
            return;
        }

        portfolio.push({
            id: Date.now(),
            ticker, shares, buyPrice, buyFee, sellFee,
            currentPrice: buyPrice
        });

        document.querySelectorAll('.form-grid input').forEach(input => input.value = '');
        saveAndRender();
    }

    function deletePosition(id) {
        portfolio = portfolio.filter(p => p.id !== id);
        saveAndRender();
    }

    function updateCurrentPrice(id, newPrice) {
        const position = portfolio.find(p => p.id === id);
        if (position) {
            position.currentPrice = parseFloat(newPrice) || 0;
            saveAndRender();
        }
    }

    function renderPortfolio() {
        const container = document.getElementById('portfolioContainer');
        container.innerHTML = '<h3>Your Portfolio</h3>';

        if (portfolio.length === 0) {
            container.innerHTML += '<p style="color: gray;">No positions yet. Drop your FBA report above to import.</p>';
            return;
        }

        portfolio.forEach(pos => {
            const totalInvested = (pos.shares * pos.buyPrice) + pos.buyFee;
            const breakEvenPrice = (totalInvested + pos.sellFee) / pos.shares;
            
            const grossValue = pos.shares * pos.currentPrice;
            const netProfit = grossValue - totalInvested - pos.sellFee;
            
            const profitClass = netProfit >= 0 ? 'profit' : 'loss';
            const profitSign = netProfit >= 0 ? '+' : '';

            const div = document.createElement('div');
            div.className = 'portfolio-item';
            div.innerHTML = `
                <div class="item-header">${pos.ticker} <br><span style="font-size:0.7em; font-weight:normal;">${pos.shares} shares @ $${pos.buyPrice.toFixed(2)}</span></div>
                <div class="metric">
                    <label>Break-Even Price</label>
                    <strong>$${breakEvenPrice.toFixed(2)}</strong>
                </div>
                <div class="metric">
                    <label>Current Price ($)</label>
                    <input type="number" step="any" value="${pos.currentPrice}" 
                           onchange="updateCurrentPrice(${pos.id}, this.value)" 
                           style="width: 80px; padding: 4px;">
                </div>
                <div class="metric">
                    <label>Net P/L</label>
                    <span class="${profitClass}">${profitSign}$${netProfit.toFixed(2)}</span>
                </div>
                <button class="delete-btn" onclick="deletePosition(${pos.id})">Remove</button>
            `;
            container.appendChild(div);
        });
    }

    renderPortfolio();
</script>

</body>
</html>
